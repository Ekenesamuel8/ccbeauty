{% include "ccstore/base.html" %}


{% load static %}

{% load crispy_forms_tags %}    


{% block content %}


<body>

    <div class="login-card">
        <div class="login-header"></div>
        <div class="login-body">

            <br>

            <h3> enter your new password</h3>
            <br>

            {% if validlink %}
            <form method="post">

                {% csrf_token %}

                {{ form|crispy }}

                <br>

                <input class="btn btn-primary" type="submit" name="update password">

            </form>
            {% else %}
            <p>This password-reset link is not valid. Request a new link.</p>
            {% endif %}
        </div>
    </div>

</body>



{% endblock %}
