{% include "ccstore/base.html" %}
{% block content %}
<div class="container mt-4"><h1>Order history</h1>
  <table class="table"><thead><tr><th>Order</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody>
  {% for order in orders %}<tr><td>#{{ order.id }}</td><td>{{ order.date_ordered }}</td><td>{{ order.get_status_display }}</td><td>&#8358;{{ order.amount_paid }}</td><td><a href="{% url 'order_detail' order.id %}">View</a></td></tr>
  {% empty %}<tr><td colspan="5">You have no orders yet.</td></tr>{% endfor %}
  </tbody></table>
</div>
{% endblock %}
