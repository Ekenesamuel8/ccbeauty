{% include "ccstore/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="login-card"><div class="login-body">
  <h4>Resend verification</h4>
  <p>Enter your email. The response is the same whether or not an account exists.</p>
  <form method="post">{% csrf_token %}{{ form|crispy }}<button class="btn btn-primary" type="submit">Send verification link</button></form>
</div></div>
{% endblock %}
