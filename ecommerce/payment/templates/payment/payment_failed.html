{% include "ccstore/base.html" %}
{% block content %}
<body>
  <div class="login-card">
    <div class="login-header"></div>
    <div class="login-body text-center">
      <h3>Payment not confirmed</h3>
      <p>Payment for order #{{ order.id }} was not confirmed.</p>
      <p>Reference: {{ payment.ref }}</p>
      <a href="{% url 'checkout' %}" class="btn btn-primary">Start a new checkout</a>
      <a href="{% url 'cart_summary' %}" class="btn btn-link">Return to cart</a>
    </div>
  </div>
</body>
{% endblock content %}
