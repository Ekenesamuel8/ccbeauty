{% extends "./base.html" %}

{% load static %}

{% block content %}

<style>
    

/* Optional: Override Bootstrap's h6 font size for larger screens */
@media (max-width: 400px) {
    
    body {
        padding-bottom: 60px; /* Adjust based on button height */
    }
}
</style>

<div class="container">

    <main class="pt-3">

        <div class="row g-3">

            <div class="col-md-5 col-lg-5 order-md-first bg-light">
            
                <!-- Carousel Start -->
                <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="{{ pdt.image.url }}" class="img-fluid mx-auto d-block product-info-image" alt="Product image">
                        </div>
                        {% for img in images %}
                            <div class="carousel-item {% if forloop.first %}active{% endif %}">
                                <img src="{{ img.image.url }}" class="img-fluid mx-auto d-block product-info-image" alt="Product image">
                            </div>
                        {% endfor %}
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>

            <div class="col-md-7 col-lg-7 ps-md-3 ps-lg-5">

                <h1 class="pdt-title "> {{pdt.title}} </h1>

                <h1 class="pdt-title ">Brand: {{pdt.brand}} </h1>

                <hr>

                <div class="text-start"><span class="h4 fw-bold">&#8358; {{pdt.price}}</span></div>

             
            
                    <div class="m-3">
                                        
                        <label for="select">Quantity</label>
                                                        
                        <select id="select">
        
                            <option value="1">1</option>
        
                            <option value="2">2</option>
        
                            <option value="3">3</option>
        
                            <option value="4">4</option>
        
                        </select>

                    </div>

               
                    
                    <button type="button" id="add-button" value="{{pdt.id }}" class="add-to-cart btn btn-primary">
                        <i class="fa fa-shopping-cart"></i>
            
                    Add to cart 
                
                    </button>                             

                

            </div>

            

        </div>

        <div class="container-fluid mt-3">

            <p> {{pdt.description}}</p>

        </div>

    </main>

    <br>

</div>

<script>    

    $ (document).on('click', '#add-button', function(e){

        e.preventDefault();

        $.ajax({

            type: 'POST',

            url: '{% url "add_cart" %}',

            data: {

                product_id: $('#add-button').val(),

                product_quantity: $('#select option:selected').text(),

                csrfmiddlewaretoken: '{{ csrf_token }}',

                action: 'post'

            },
            success: function(json){
                
                document.getElementById('cart_qty').textContent = json.qty
            
            },

            error: function(xhr, errmsg, err){

            }

        });
    })
</script>

{% endblock %}
