{% extends "./base.html" %}

{% load static %}

{% block content %}

<style>

    /* Custom styles for the product title */
.pdt-title {
  color: #212529; /* Bootstrap's dark color (text-dark) */
  line-height: 1.3; /* Improved readability */
  letter-spacing: -0.001em; /* Subtle tightening */
  text-transform: capitalize; /* Polished appearance */
  font-size: 1.3rem; /* Slightly larger for emphasis */
}
.add-to-cart {
    margin-left: 70%;
    }

/* Optional: Override Bootstrap's h6 font size for larger screens */
@media (max-width: 400px) {
  .pdt-title {
    font-size: 1.0rem; /* Larger size for desktops */
    letter-spacing: -0.02em; /* Subtle tightening */
  }
  .add-to-cart {
        width: 40%; /* Full width for small screens */
        position: fixed; /* Stick to the bottom */
        bottom: 0; /* Align to the bottom */
        right: 0; /* Align to the left */
        z-index: 1000; /* Ensure it stays above other content */
        border-radius: 30; /* Optional: remove rounded corners for a cleaner look */
        padding: 8px; /* Optional: adjust padding for better appearance */
        padding-left: 0;
        margin: 0;
    }
    body {
        padding-bottom: 60px; /* Adjust based on button height */
    }
}
</style>

<div class="container">

    <main class="pt-3">

        <div class="row g-3">

            <div class="col-md-5 col-lg-5 order-md-first bg-light">
            
                <img class="img-fluid mx-auto d-block" alt="Responsive image" src="{{pdt.image.url}}"> <!-- Product image -->
            
            </div>

            <div class="col-md-7 col-lg-7 ps-md-3 ps-lg-5">

                <h1 class="pdt-title "> {{pdt.title}} </h1>

                <h1 class="pdt-title ">Brand: {{pdt.brand}} </h1>

                <hr>

                <div class="text-start"><span class="h4 fw-bold">&#8358; {{pdt.price}}</span></div>

             
            
                    <div class="m-3">
                                        
                        <label for="select">Quantity</label>
                                                        
                        <select id="select">
        
                            <option value="1">1</option>
        
                            <option value="2">2</option>
        
                            <option value="3">3</option>
        
                            <option value="4">4</option>
        
                        </select>

                    </div>

               
                    
                    <button type="button" id="add-button" value="{{pdt.id }}" class="add-to-cart btn btn-primary">
                        <i class="fa fa-shopping-cart"></i>
            
                    Add to cart 
                
                    </button>                             

                

            </div>

            

        </div>

        <div class="container-fluid mt-3">

            <p> {{pdt.description}} hhhhh</p>

        </div>

    </main>

    <br>

</div>

<script>    

    $ (document).on('click', '#add-button', function(e){

        e.preventDefault();

        $.ajax({

            type: 'POST',

            url: '{% url "add_cart" %}',

            data: {

                product_id: $('#add-button').val(),

                product_quantity: $('#select option:selected').text(),

                csrfmiddlewaretoken: '{{ csrf_token }}',

                action: 'post'

            },
            success: function(json){
                
                document.getElementById('cart_qty').textContent = json.qty
            
            },

            error: function(xhr, errmsg, err){

            }

        });
    })
</script>

{% endblock %}
