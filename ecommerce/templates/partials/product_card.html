{% load static %}<article class="card product-card h-100">
  <a href="{{ product.get_absolute_url }}"><img class="card-img-top product-card-img" src="{% if product.image %}{{ product.image.url }}{% else %}{% static 'media/images/default.png' %}{% endif %}" alt="{{ product.title }}"></a>
  <div class="card-body"><h2 class="h6 card-title"><a href="{{ product.get_absolute_url }}">{{ product.title }}</a></h2><p class="mb-1">&#8358;{{ product.price }}</p>{% if product.is_available %}<span class="badge text-bg-success">In stock</span>{% else %}<span class="badge text-bg-secondary">Out of stock</span>{% endif %}</div>
</article>
