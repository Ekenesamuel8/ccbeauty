{% if page_obj.paginator.num_pages > 1 %}<nav aria-label="Results pages"><ul class="pagination justify-content-center">
  <li class="page-item{% if not page_obj.has_previous %} disabled{% endif %}">{% if page_obj.has_previous %}<a class="page-link" href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}{% if selected_sort %}&amp;sort={{ selected_sort|urlencode }}{% endif %}" rel="prev">Previous</a>{% else %}<span class="page-link">Previous</span>{% endif %}</li>
  <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
  <li class="page-item{% if not page_obj.has_next %} disabled{% endif %}">{% if page_obj.has_next %}<a class="page-link" href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}{% if selected_sort %}&amp;sort={{ selected_sort|urlencode }}{% endif %}" rel="next">Next</a>{% else %}<span class="page-link">Next</span>{% endif %}</li>
</ul></nav>{% endif %}
