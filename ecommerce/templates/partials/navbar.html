<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark" aria-label="Primary navigation">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'store' %}">CCbeauty</a>
    <a class="nav-link position-relative me-3" href="{% url 'cart_summary' %}" aria-label="Shopping cart with {{ cart|length }} items">
      <i class="fa fa-shopping-cart" aria-hidden="true"></i>
      <span id="cart_qty" class="badge bg-dark">{{ cart|length|default:0 }}</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#primaryNav" aria-controls="primaryNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="primaryNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item dropdown">
          <button class="nav-link dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Categories</button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{% url 'store' %}">All products</a></li>
            {% for cat in all_categories %}<li><a class="dropdown-item" href="{{ cat.get_absolute_url }}">{{ cat.name|capfirst }}</a></li>{% endfor %}
          </ul>
        </li>
      </ul>
      <form class="d-flex my-2 my-lg-0 me-lg-3" method="get" action="{% url 'search' %}" role="search">
        <label class="visually-hidden" for="global-search">Search products</label>
        <input id="global-search" class="form-control me-2" type="search" name="q" value="{{ query|default:'' }}" placeholder="Search products">
        <button class="btn btn-light" type="submit">Search</button>
      </form>
      <ul class="navbar-nav align-items-lg-center">
        {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}" href="{% url 'dashboard' %}">Account</a></li>
          <li class="nav-item"><a class="nav-link{% if request.resolver_match.url_name == 'order_history' %} active{% endif %}" href="{% url 'order_history' %}">Orders</a></li>
          <li class="nav-item"><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="nav-link border-0 bg-transparent" type="submit">Logout</button></form></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
